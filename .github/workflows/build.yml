
name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: |
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem @capacitor/share
          npm i -D @capacitor/assets

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html
          echo '{"appId":"com.soillab.compaction","appName":"تراکم آزمایشگاهی","webDir":"www"}' > capacitor.config.json

      - name: Add Android project
        run: |
          npx cap add android
          npx capacitor-assets generate --android

      - name: Add native PDF plugin
        run: |
          D=android/app/src/main/java/com/soillab/compaction
          mkdir -p "$D"

          cat > "$D/SavePdfPlugin.java" <<'EOF'
          package com.soillab.compaction;

          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;

          @CapacitorPlugin(name = "SavePdf")
          public class SavePdfPlugin extends Plugin {
            @PluginMethod
            public void save(PluginCall call) {
              String name = call.getString("name", "report.pdf");
              String data = call.getString("data");

              if (data == null) {
                call.reject("no data");
                return;
              }

              try {
                byte[] bytes = Base64.decode(data, Base64.DEFAULT);

                if (Build.VERSION.SDK_INT >= 29) {
                  ContentResolver cr = getContext().getContentResolver();
                  ContentValues v = new ContentValues();

                  v.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                  v.put(MediaStore.MediaColumns.MIME_TYPE, "application/pdf");
                  v.put(MediaStore.MediaColumns.RELATIVE_PATH,
                      Environment.DIRECTORY_DOWNLOADS);

                  Uri uri = cr.insert(
                      MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);

                  if (uri == null) {
                    call.reject("insert failed");
                    return;
                  }

                  try (OutputStream os = cr.openOutputStream(uri)) {
                    if (os == null) {
                      call.reject("open failed");
                      return;
                    }
                    os.write(bytes);
                  }

                } else {
                  File dir = Environment.getExternalStoragePublicDirectory(
                      Environment.DIRECTORY_DOWNLOADS);
                  dir.mkdirs();

                  try (FileOutputStream os =
                      new FileOutputStream(new File(dir, name))) {
                    os.write(bytes);
                  }
                }

                JSObject res = new JSObject();
                res.put("path", "Download/" + name);
                call.resolve(res);

              } catch (Exception e) {
                call.reject(String.valueOf(e.getMessage()));
              }
            }
          }
          EOF

          cat > "$D/MainActivity.java" <<'EOF'
          package com.soillab.compaction;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(SavePdfPlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          EOF

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-key.jks

      - name: Add signing config
        run: |
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file("release-key.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build Android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: soil-lab-apk-release
          path: android/app/build/outputs/apk/release/app-release.apk
