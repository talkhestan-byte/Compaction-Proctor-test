<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>آزمایش تراکم خاک</title>
<style>
:root{--ink:#14233a;--line:#b8c2d0;--head:#dde5ef;--calc:#e9f1e6;--soil:#8a4b1f;--bg:#e9edf2}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font:14px Roboto,Arial,sans-serif;font-feature-settings:"lnum";background:var(--bg);color:var(--ink);padding-bottom:max(env(safe-area-inset-bottom,0px),24px)}
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;background:var(--ink);color:#fff;padding:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px),40px) 14px 8px}
.bar h1{font-size:16px;margin:0}
.mb{background:none;color:#fff;font-size:26px;width:44px;height:36px;padding:0;margin:0;border:0;line-height:1}
.menu{position:absolute;left:10px;top:100%;min-width:160px;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 4px 14px #0004;overflow:hidden}
.menu button{display:block;width:100%;margin:0;border:0;border-bottom:1px solid var(--line);border-radius:0;background:#fff;color:var(--ink);text-align:right;padding:12px 14px}
.sheet{width:calc(100% - 20px);max-width:860px;margin:10px auto;background:#fff;border:1px solid var(--line);padding:12px}
.sheet h2{font-size:16px;margin:0 0 10px;text-align:right}
.blk{margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.blk:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.blk h3{font-size:13px;margin:0 0 8px}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px}
.info label{display:flex;flex-direction:column;gap:3px;font-size:12px}
.info .wide{grid-column:span 2}
input,select,textarea,button{font:inherit;padding:7px;border:1px solid var(--line);border-radius:4px;width:100%;background:#fff;color:var(--ink)}
input,select{text-align:center}
textarea{resize:vertical;min-height:84px}
button{width:auto;background:var(--ink);color:#fff;border:0;padding:8px 12px;margin-top:8px}
.wrap{overflow-x:auto}
table{border-collapse:collapse;min-width:820px;width:100%}
th,td{border:1px solid var(--line);padding:3px;text-align:center;font-size:12px}
th{background:var(--head)}
td.l{position:sticky;right:0;background:#f7f9fc;text-align:right;min-width:130px;font-weight:bold}
td.sec{background:var(--head);font-weight:bold;text-align:right}
td.c{background:var(--calc);direction:ltr}
td input{padding:4px;min-width:54px}
.res{display:flex;gap:8px;margin-top:10px}
.res div{flex:1;border:1px solid var(--line);border-radius:4px;padding:8px;text-align:center;font-size:12px}
.res b{display:block;font-size:18px;color:var(--soil);direction:ltr}
canvas{width:100%;height:400px;display:block}
#dlg{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;z-index:30;padding:20px}
#dlg .box{background:#fff;border-radius:8px;padding:14px;width:100%;max-width:340px}
#dlg .btns{display:flex;gap:8px;margin-top:10px}
#dlg button{flex:1;margin:0}
#dlg .alt{background:#e6ebf3;color:var(--ink)}
#toast{position:fixed;bottom:16px;right:16px;left:16px;background:var(--ink);color:#fff;padding:10px;border-radius:6px;text-align:center;font-size:12px;z-index:40}
</style>
</head>
<body>
<header class="bar">
 <h1>آزمایش تراکم خاک</h1>
 <button id="mb" class="mb" aria-label="منو">&#8942;</button>
 <div id="menu" class="menu" hidden><button data-a="print">چاپ PDF</button><button data-a="share">اشتراک‌گذاری</button></div>
</header>

<main class="sheet">
 <h2>آزمایش تراکم خاک</h2>
 <section class="blk">
  <div class="info">
   <label class="wide">نام پروژه<input id="proj" type="text" style="text-align:right"></label>
   <label>تاریخ آزمون<input id="dt" type="text" class="n" inputmode="numeric" placeholder="1405/01/01"></label>
   <label>نوع آزمایش<select id="type"><option>استاندارد (ASTM D698 / AASHTO T99)</option><option>اصلاح‌شده (ASTM D1557 / AASHTO T180)</option></select></label>
   <label>قالب<select id="preset"><option value="944">4 inch (944 cm³)</option><option value="2124">6 inch (2124 cm³)</option><option value="">دلخواه</option></select></label>
   <label>حجم قالب (cm³)<input id="vol" type="text" class="n" inputmode="decimal" value="944"></label>
   <label>جرم قالب (g)<input id="mold" type="text" class="n" inputmode="decimal"></label>
   <label>وزن مخصوص دانه‌ها Gs<input id="gs" type="text" class="n" inputmode="decimal" value="2.65"></label>
  </div>
  
 </section>

 <section class="blk">
  <h3>جدول محاسبات</h3>
  <div class="wrap"><table id="tb"></table></div>
  <div class="res">
   <div>رطوبت بهینه OMC<b id="omc">—</b></div>
   <div>حداکثر وزن مخصوص خشک<b id="gdm">—</b></div>
  </div>
  <h3 style="margin-top:14px">اصلاح درشت‌دانه (ASTM D4718)</h3>
  <div class="info">
   <label>درصد درشت‌دانه Pc (%)<input id="pc" type="text" class="n" inputmode="decimal"></label>
   <label>وزن مخصوص حجمی درشت‌دانه Gm<input id="gm" type="text" class="n" inputmode="decimal"></label>
   <label>جذب آب درشت‌دانه (%)<input id="wcz" type="text" class="n" inputmode="decimal"></label>
  </div>
  <div class="res">
   <div>γdmax اصلاح‌شده<b id="dcor">—</b></div>
   <div>OMC اصلاح‌شده<b id="wcor">—</b></div>
  </div>
 </section>

 <section class="blk">
  <h3>منحنی تراکم و منحنی‌های درجه اشباع</h3>
  <canvas id="cv"></canvas>
 </section>

 <section class="blk">
  <h3>توضیحات</h3>
  <textarea id="desc"></textarea>
 </section>
</main>

<div id="dlg" hidden><div class="box"><b>نام فایل PDF را وارد کنید</b><input id="fname" style="margin-top:8px"><div class="btns"><button id="ok">ذخیره PDF</button><button id="no" class="alt">انصراف</button></div></div></div>
<div id="toast" hidden></div>

<script>
const N=5,FF='Roboto, Arial, sans-serif',$=id=>document.getElementById(id);
const num=id=>{const v=parseFloat($(id).value);return isNaN(v)?NaN:v};
const put=(id,v,d)=>{$(id).textContent=isFinite(v)?v.toFixed(d):''};
let last={pts:[],Gs:NaN};

function g2j(gy,gm,gd){
  const g=[0,31,59,90,120,151,181,212,243,273,304,334];
  let jy=gy>1600?979:0;gy-=gy>1600?1600:621;
  const gy2=gm>2?gy+1:gy;
  let days=365*gy+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)-80+gd+g[gm-1];
  jy+=33*Math.floor(days/12053);days%=12053;
  jy+=4*Math.floor(days/1461);days%=1461;
  if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365}
  const jm=days<186?1+Math.floor(days/31):7+Math.floor((days-186)/30);
  const jd=1+(days<186?days%31:(days-186)%30);
  return jy+'/'+String(jm).padStart(2,'0')+'/'+String(jd).padStart(2,'0');
}

function build(){
  let h='<tr><th>شرح</th>';
  for(let i=0;i<N;i++)h+=`<th colspan="2">مرحله ${i+1}</th>`;
  h+='</tr>';
  const sec=t=>`<tr><td class="l sec">${t}</td>${'<td class="sec" colspan="2"></td>'.repeat(N)}</tr>`;
  const row=(t,f)=>{let r=`<tr><td class="l">${t}</td>`;for(let i=0;i<N;i++)r+=f(i);return r+'</tr>'};
  const inp=id=>`<input id="${id}" class="n" type="text" inputmode="decimal">`;
  const one=(k,inpt)=>i=>inpt?`<td colspan="2">${inp(k+i)}</td>`:`<td colspan="2" class="c" id="${k}${i}"></td>`;
  const two=(k,inpt)=>i=>[0,1].map(j=>inpt?`<td>${inp(k+i+j)}</td>`:`<td class="c" id="${k}${i}${j}"></td>`).join('');
  h+=sec('وزن مخصوص تر');
  h+=row('جرم قالب + خاک تر (g)',one('m',1));
  h+=row('جرم خاک تر (g)',one('ms'));
  h+=row('وزن مخصوص تر γt (g/cm³)',one('gt'));
  h+=sec('تعیین رطوبت');
  h+=row('شماره ظرف',()=>'<td>1</td><td>2</td>');
  h+=row('جرم ظرف + خاک تر (g)',two('wt',1));
  h+=row('جرم ظرف + خاک خشک (g)',two('dr',1));
  h+=row('جرم ظرف (g)',two('ta',1));
  h+=row('جرم آب (g)',two('mw'));
  h+=row('جرم خاک خشک (g)',two('md'));
  h+=row('درصد رطوبت w (%)',two('w'));
  h+=row('رطوبت متوسط (%)',one('wa'));
  h+=sec('نتایج');
  h+=row('وزن مخصوص خشک γd (g/cm³)',one('gd'));
  h+=row('وزن مخصوص خشک γd (kN/m³)',one('gk'));
  h+=row('نسبت تخلخل e',one('e'));
  h+=row('درجه اشباع S (%)',one('S'));
  h+=row('درصد فضای خالی هوا Va (%)',one('va'));
  $('tb').innerHTML=h;
}

function calc(){
  const mold=num('mold'),V=num('vol'),Gs=num('gs'),pts=[];
  for(let i=0;i<N;i++){
    const ms=num('m'+i)-mold,gt=ms/V;
    put('ms'+i,ms,1);put('gt'+i,gt,3);
    const ws=[];
    for(let j=0;j<2;j++){
      const a=num('wt'+i+j),b=num('dr'+i+j),c=num('ta'+i+j);
      const mw=a-b,md=b-c,w=mw/md*100;
      put('mw'+i+j,mw,2);put('md'+i+j,md,2);put('w'+i+j,w,2);
      if(isFinite(w))ws.push(w);
    }
    const wa=ws.length?ws.reduce((s,x)=>s+x,0)/ws.length:NaN;
    put('wa'+i,wa,2);
    const gd=gt/(1+wa/100),e=Gs/gd-1;
    put('gd'+i,gd,3);put('gk'+i,gd*9.81,2);put('e'+i,e,3);
    put('S'+i,wa*Gs/e,1);
    put('va'+i,100*(1-gd*(1/Gs+wa/100)),1);
    if(isFinite(gd)&&isFinite(wa))pts.push({w:wa,d:gd});
  }
  draw(pts,Gs);
}

function fit(p){
  const S=[0,0,0,0,0],T=[0,0,0];
  p.forEach(q=>{for(let k=0;k<5;k++)S[k]+=q.w**k;for(let k=0;k<3;k++)T[k]+=q.d*q.w**k});
  const M=[[S[4],S[3],S[2],T[2]],[S[3],S[2],S[1],T[1]],[S[2],S[1],S[0],T[0]]];
  for(let i=0;i<3;i++){
    let m=i;for(let r=i+1;r<3;r++)if(Math.abs(M[r][i])>Math.abs(M[m][i]))m=r;
    [M[i],M[m]]=[M[m],M[i]];
    if(Math.abs(M[i][i])<1e-12)return null;
    for(let r=0;r<3;r++)if(r!==i){const f=M[r][i]/M[i][i];for(let c=i;c<4;c++)M[r][c]-=f*M[i][c]}
  }
  return [M[0][3]/M[0][0],M[1][3]/M[1][1],M[2][3]/M[2][2]];
}

function render(x,W,H,pts,Gs){
  x.direction='ltr';x.textBaseline='alphabetic';x.setLineDash([]);
  let w0=0,w1=30,y0=1.4,y1=2.2;
  if(pts.length){
    const ws=pts.map(p=>p.w),ds=pts.map(p=>p.d);
    w0=Math.max(0,Math.floor(Math.min(...ws)-3));w1=Math.ceil(Math.max(...ws)+3);
    y0=Math.floor((Math.min(...ds)-0.15)*20)/20;y1=Math.ceil((Math.max(...ds)+0.15)*20)/20;
  }
  const L=46,R=52,T=12,B=36;
  const px=w=>L+(w-w0)/(w1-w0)*(W-L-R),py=d=>H-B-(d-y0)/(y1-y0)*(H-T-B);
  x.font='11px '+FF;x.fillStyle='#14233a';
  // vertical grid
  x.strokeStyle='#d5dbe4';x.lineWidth=1;x.textAlign='center';
  const ws=Math.max(1,Math.round((w1-w0)/8));
  for(let w=w0;w<=w1;w+=ws){x.beginPath();x.moveTo(px(w),T);x.lineTo(px(w),H-B);x.stroke();x.fillText(w,px(w),H-B+14)}
  // horizontal grid: minor every 0.01, major + labels every 0.05
  const k0=Math.round(y0*100),k1=Math.round(y1*100);
  for(let k=k0;k<=k1;k++){
    const major=k%5===0,Y=py(k/100);
    x.strokeStyle=major?'#aab4c2':'#e6eaf0';x.lineWidth=major?1:0.6;
    x.beginPath();x.moveTo(L,Y);x.lineTo(W-R,Y);x.stroke();
    if(major){x.textAlign='right';x.fillStyle='#14233a';x.fillText((k/100).toFixed(2),L-4,Y+4)}
  }
  x.lineWidth=1;x.strokeStyle='#14233a';x.strokeRect(L,T,W-L-R,H-T-B);
  x.fillStyle='#14233a';x.textAlign='center';x.fillText('رطوبت (%)',(L+W-R)/2,H-6);
  x.save();x.translate(11,(T+H-B)/2);x.rotate(-Math.PI/2);x.fillText('γd (g/cm³)',0,0);x.restore();
  if(!(Gs>0))return null;
  const labs=[];
  x.save();x.beginPath();x.rect(L,T,W-L-R,H-T-B);x.clip();
  [100,90,80,70,60].forEach((S,k)=>{
    const col=`hsl(210,75%,${28+k*10}%)`;
    x.strokeStyle=col;x.lineWidth=1.4;x.beginPath();
    let first=true;
    for(let w=Math.max(w0,0.2);w<=w1+0.01;w+=0.2){
      const Y=py(Gs/(1+w*Gs/S));
      first?x.moveTo(px(w),Y):x.lineTo(px(w),Y);first=false;
    }
    x.stroke();
    const Y1=py(Gs/(1+w1*Gs/S));
    labs.push({t:'S='+S+'%',y:Math.min(Math.max(Y1,T+6),H-B-6),c:col});
  });
  x.restore();
  labs.sort((a,b)=>a.y-b.y);
  for(let i=1;i<labs.length;i++)if(labs[i].y<labs[i-1].y+13)labs[i].y=labs[i-1].y+13;
  for(let i=labs.length-1;i>=0;i--){
    const lim=i===labs.length-1?H-B-4:labs[i+1].y-13;
    if(labs[i].y>lim)labs[i].y=lim;
  }
  x.textAlign='left';
  labs.forEach(l=>{x.fillStyle=l.c;x.fillText(l.t,W-R+5,l.y+4)});
  if(!pts.length)return null;
  x.fillStyle='#8a4b1f';
  pts.forEach(p=>{x.beginPath();x.arc(px(p.w),py(p.d),4,0,7);x.fill()});
  const c=pts.length>=3?fit(pts):null;
  if(!c||c[0]>=0)return null;
  x.save();x.beginPath();x.rect(L,T,W-L-R,H-T-B);x.clip();
  x.strokeStyle='#8a4b1f';x.lineWidth=2.2;x.beginPath();
  const a=Math.min(...pts.map(p=>p.w))-1,b=Math.max(...pts.map(p=>p.w))+1;
  for(let w=a;w<=b+1e-9;w+=0.1){const Y=py(c[0]*w*w+c[1]*w+c[2]);w===a?x.moveTo(px(w),Y):x.lineTo(px(w),Y)}
  x.stroke();x.restore();
  const wo=-c[1]/(2*c[0]),dm=c[0]*wo*wo+c[1]*wo+c[2];
  x.strokeStyle='#8a4b1f';x.setLineDash([5,4]);x.lineWidth=1;x.beginPath();
  x.moveTo(px(wo),H-B);x.lineTo(px(wo),py(dm));x.lineTo(L,py(dm));x.stroke();x.setLineDash([]);
  return {wo,dm};
}

function oszCalc(){
  const r=last.r,Pc=num('pc'),Gm=num('gm'),wc=num('wcz');
  if(!r||!(Pc>0)||!(Pc<100)||!(Gm>0))return null;
  const Pf=100-Pc;
  return {dc:100/(Pf/r.dm+Pc/Gm),wo:(Pf*r.wo+Pc*(isFinite(wc)?wc:0))/100};
}
function showOsz(){
  const o=oszCalc();
  $('dcor').textContent=o?o.dc.toFixed(3)+' g/cm³':'—';
  $('wcor').textContent=o?o.wo.toFixed(1)+' %':'—';
}

function draw(pts,Gs){
  last={pts,Gs};
  const cv=$('cv'),dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
  cv.width=W*dpr;cv.height=H*dpr;
  const x=cv.getContext('2d');x.scale(dpr,dpr);
  const r=render(x,W,H,pts,Gs);
  last.r=r;showOsz();
  $('omc').textContent=r?r.wo.toFixed(1)+' %':'—';
  $('gdm').textContent=r?r.dm.toFixed(3)+' g/cm³':'—';
}

/* ---------- A4 PDF ---------- */
function wrapText(x,text,maxW){
  const out=[];
  text.split('\n').forEach(par=>{
    let line='';
    par.split(/\s+/).forEach(wd=>{
      const t=line?line+' '+wd:wd;
      if(x.measureText(t).width>maxW&&line){out.push(line);line=wd}else line=t;
    });
    out.push(line);
  });
  return out;
}

function rowRL(x,parts,xr,y){
  let cx=xr;
  parts.forEach(([t,d,g])=>{
    x.direction=d||'rtl';x.textAlign='right';
    x.fillText(t,cx,y);cx-=x.measureText(t).width+(g===undefined?6:g);
  });
}

function renderPage(){
  const S=2,PW=794,PH=1123,M=20,cv=document.createElement('canvas');
  cv.width=PW*S;cv.height=PH*S;
  const x=cv.getContext('2d');x.scale(S,S);
  x.fillStyle='#fff';x.fillRect(0,0,PW,PH);
  x.fillStyle='#14233a';x.direction='rtl';x.textBaseline='middle';
  x.textAlign='right';x.font='bold 17px '+FF;x.fillText('آزمایش تراکم خاک',PW-M,26);
  x.font='11px '+FF;
  const tt=$('type').value,tm=tt.match(/^(.*?)\s*\((.*)\)$/),tn=tm?tm[1]:tt,tc=tm?tm[2]:'',v=id=>$(id).value.trim()||'-';
  rowRL(x,[['نام پروژه:'],[v('proj'),'rtl',44],['تاریخ آزمون:'],[v('dt'),'ltr']],PW-M,50);
  rowRL(x,[['نوع آزمایش:'],[tn],[tc,'ltr',24],['حجم قالب:'],[v('vol')+' cm³','ltr',24],['جرم قالب:'],[v('mold')+' g','ltr',24],['وزن مخصوص Gs:'],[v('gs'),'ltr']],PW-M,68);
  x.direction='rtl';
  x.strokeStyle='#14233a';x.lineWidth=1;x.beginPath();x.moveTo(M,78);x.lineTo(PW-M,78);x.stroke();
  const LW=150,CW=(PW-2*M-LW)/(2*N),RH=17;
  let y=86;
  x.font='9px '+FF;x.strokeStyle='#8794a6';x.lineWidth=.6;
  [...$('tb').rows].forEach(tr=>{
    let cx=PW-M;
    [...tr.cells].forEach((td,ci)=>{
      const w=ci===0?LW:CW*(td.colSpan||1),inp=td.querySelector('input');
      const t=(inp?inp.value:td.textContent).trim(),k=td.classList;
      x.fillStyle=k.contains('sec')||td.tagName==='TH'?'#dde5ef':k.contains('c')?'#e9f1e6':k.contains('l')?'#f7f9fc':'#fff';
      x.fillRect(cx-w,y,w,RH);x.strokeRect(cx-w,y,w,RH);
      x.fillStyle='#14233a';
      if(ci===0){x.textAlign='right';x.fillText(t,cx-4,y+RH/2+.5)}
      else{x.textAlign='center';x.fillText(t,cx-w/2,y+RH/2+.5)}
      cx-=w;
    });
    y+=RH;
  });
  const o=oszCalc();
  x.font='bold 12px '+FF;x.fillStyle='#14233a';
  rowRL(x,[['رطوبت بهینه (OMC):'],[$('omc').textContent,'ltr',34],['حداکثر وزن مخصوص خشک (γdmax):'],[$('gdm').textContent,'ltr']],PW-M,y+16);
  x.font='11px '+FF;
  if(o){
    rowRL(x,[['اصلاح درشت‌دانه (ASTM D4718):','rtl',26],['درصد درشت‌دانه Pc:'],[v('pc')+' %','ltr',22],['وزن مخصوص حجمی Gm:'],[v('gm'),'ltr',22],['جذب آب:'],[($('wcz').value.trim()||'0')+' %','ltr']],PW-M,y+36);
    rowRL(x,[['نتیجه‌ی اصلاح:','rtl',26],['γdmax اصلاح‌شده:'],[o.dc.toFixed(3)+' g/cm³','ltr',22],['OMC اصلاح‌شده:'],[o.wo.toFixed(1)+' %','ltr']],PW-M,y+54);
  }
  x.direction='rtl';
  const cy=y+(o?72:30),CH=350,GW=600;
  x.save();x.translate(M+(PW-2*M-GW)/2,cy);render(x,GW,CH,last.pts,last.Gs);x.restore();
  // description
  const dy=cy+CH+10;
  x.textBaseline='middle';x.direction='rtl';
  x.font='bold 12px '+FF;x.textAlign='right';x.fillStyle='#14233a';x.fillText('توضیحات:',PW-M,dy+10);
  x.font='11px '+FF;
  const lines=wrapText(x,$('desc').value.trim(),PW-2*M-16),maxL=Math.floor((PH-M-dy-30)/15);
  lines.slice(0,Math.max(maxL,1)).forEach((l,i)=>x.fillText(l,PW-M-8,dy+32+i*15));
  x.strokeStyle='#8794a6';x.lineWidth=.6;x.strokeRect(M,dy+20,PW-2*M,PH-M-dy-20);
  return cv;
}

function makePDF(cv){
  const bin=atob(cv.toDataURL('image/jpeg',0.92).split(',')[1]);
  const img=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)img[i]=bin.charCodeAt(i);
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const add=b=>{if(typeof b==='string')b=enc.encode(b);parts.push(b);len+=b.length};
  const obj=(n,head,stream)=>{
    offs[n]=len;add(`${n} 0 obj\n`);
    if(stream){add(head.replace('LEN',stream.length)+'\nstream\n');add(stream);add('\nendstream\nendobj\n')}
    else add(head+'\nendobj\n');
  };
  const PWp=595.28,PHp=841.89;
  add('%PDF-1.4\n');
  obj(1,'<</Type/Catalog/Pages 2 0 R>>');
  obj(2,'<</Type/Pages/Kids[3 0 R]/Count 1>>');
  obj(3,`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${PWp} ${PHp}]/Resources<</XObject<</Im0 4 0 R>>>>/Contents 5 0 R>>`);
  obj(4,`<</Type/XObject/Subtype/Image/Width ${cv.width}/Height ${cv.height}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length LEN>>`,img);
  obj(5,'<</Length LEN>>',enc.encode(`q ${PWp} 0 0 ${PHp} 0 0 cm /Im0 Do Q`));
  const xr=len;
  add('xref\n0 6\n0000000000 65535 f \n');
  for(let i=1;i<=5;i++)add(String(offs[i]).padStart(10,'0')+' 00000 n \n');
  add(`trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n${xr}\n%%EOF`);
  const out=new Uint8Array(len);let p=0;parts.forEach(b=>{out.set(b,p);p+=b.length});
  return out;
}

function b64(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)}
const clean=s=>s.replace(/[\\\/:*?"<>|]/g,'-').trim();
const defName=()=>clean(($('proj').value.trim()||'تراکم')+'-'+($('dt').value.trim()||new Date().toISOString().slice(0,10)));
const toast=t=>{const d=$('toast');d.textContent=t;d.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>{d.hidden=true},4500)};

async function exportPDF(name,mode){
  try{
    const u8=makePDF(renderPage()),fn=clean(name)+'.pdf',P=window.Capacitor&&Capacitor.Plugins;
    if(P&&(P.SavePdf||P.Filesystem)){
      const data=b64(u8);
      if(mode==='save'){
        if(P.SavePdf){try{const r=await P.SavePdf.save({name:fn,data});toast('ذخیره شد: '+(r.path||'Download/'+fn));return}catch(e){}}
        if(P.Filesystem){try{await P.Filesystem.writeFile({path:fn,data,directory:'DOCUMENTS',recursive:true});toast('ذخیره شد: Documents/'+fn);return}catch(e){}}
        toast('ذخیره‌ی مستقیم ممکن نشد. از منوی اشتراک‌گذاری استفاده کن.');return;
      }
      const r=await P.Filesystem.writeFile({path:fn,data,directory:'CACHE'});
      await P.Share.share({title:fn,files:[r.uri]});
    }else{
      const f=new File([u8],fn,{type:'application/pdf'});
      if(mode==='share'&&navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:fn});
      else{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=fn;a.click()}
    }
  }catch(e){toast('خطا: '+(e.message||e))}
}

/* digits: always Latin */
const toLatin=s=>s.replace(/[۰-۹]/g,c=>c.charCodeAt(0)-1776).replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).replace(/[٫،,]/g,'.').replace(/[٪]/g,'%').replace(/[\/٬]/g,'/');
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.classList&&t.classList.contains('n')&&t.id!=='dt'){const v=toLatin(t.value);if(v!==t.value)t.value=v}
  if(t.id==='dt'){const v=toLatin(t.value).replace(/[^0-9\/]/g,'');if(v!==t.value)t.value=v}
});

/* ---------- Bazaar license check (edit these two after setting up the SKU) ---------- */
const BAZAAR_SKU='soillab_full';
const BAZAAR_RSA='PUT_YOUR_BAZAAR_RSA_PUBLIC_KEY_HERE';
const GRACE_MS=2*24*60*60*1000;

function lockUI(msg){
  document.querySelectorAll('main.sheet').forEach(e=>e.style.display='none');
  $('mb').style.display='none';
  let l=$('lock');
  if(!l){
    l=document.createElement('div');l.id='lock';
    l.style.cssText='position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;z-index:50';
    document.body.appendChild(l);
    const b=document.createElement('button');b.id='lockRetry';b.textContent='تلاش دوباره';
    b.onclick=()=>{l.remove();document.querySelectorAll('main.sheet').forEach(e=>e.style.display='');$('mb').style.display='';checkLicense()};
    const p=document.createElement('div');p.id='lockMsg';p.style.cssText='font-size:15px;max-width:320px';p.textContent=msg;
    l.appendChild(p);l.appendChild(b);
  }else $('lockMsg').textContent=msg;
}
function unlockUI(){const l=$('lock');if(l)l.remove()}

function checkLicense(){
  const P=window.Capacitor&&Capacitor.Plugins;
  if(!P||!P.BazaarLicense)return; // web/dev build: no gate
  const lastOk=parseInt(localStorage.getItem('lic_ts')||'0',10);
  let done=false;
  const timeout=setTimeout(()=>{done=true;onFail()},8000);
  function onOk(){if(done)return;done=true;clearTimeout(timeout);try{localStorage.setItem('lic_ts',Date.now())}catch(e){}unlockUI()}
  function onFail(){if(done)return;done=true;clearTimeout(timeout);
    if(lastOk>0&&Date.now()-lastOk<GRACE_MS)unlockUI();
    else lockUI('این برنامه باید حداقل هر 2 روز یک‌بار به اینترنت وصل شود تا مجوز خرید آن از کافه‌بازار بررسی شود.');
  }
  P.BazaarLicense.check({sku:BAZAAR_SKU,rsaKey:BAZAAR_RSA}).then(r=>{
    if(done)return;
    if(r&&r.owned)onOk();
    else{done=true;clearTimeout(timeout);try{localStorage.removeItem('lic_ts')}catch(e){}lockUI('خرید این برنامه برای این حساب کافه‌بازار یافت نشد.')}
  }).catch(()=>onFail());
}
checkLicense();
